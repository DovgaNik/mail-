<div class="main-content text-center py-5">
  <h1 class="title-red">Free Temporary Email</h1>
  <p class="subtitle">Receive emails anonymously with our free, private, and secure temporary email address generator.</p>

  <div class="generator-container">
    <div class="red-pill-bar">
      <input type="text" class="email-input" [value]="email_adress" readonly>
      
      <div class="action-buttons">
        <!-- Bouton pour coper l'adresse mail -->
        <button class="btn-action" (click)="onCopyButtonClick()">
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <!-- Bouton pour demander à générer un nouveau mail -->
        <button class="btn-action" (click)="getNewEmailAndSetCookie()">
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="mt-5">
    <app-mailbox [token]="token"></app-mailbox>
  </div>
</div>
